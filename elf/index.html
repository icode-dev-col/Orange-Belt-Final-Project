<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerald Archer - Training Grounds</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            overflow: hidden;
        }

        .magical-bg-container {
            background-image: url('../images/elf.png');
            filter: brightness(0.3) contrast(1.1);
        }

        .game-canvas-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        .archery-canvas {
            width: 100%;
            max-width: 1000px;
            height: 600px;
            background: radial-gradient(circle at 50% 40%, rgba(26, 58, 42, 0.4) 0%, rgba(4, 13, 8, 0.8) 70%);
            border: 2px solid var(--gold);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .target {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(239, 68, 68, 0.2);
            border: 4px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
        }
        .target::after {
            content: '';
            width: 15px;
            height: 15px;
            background: #ef4444;
            border-radius: 50%;
        }

        /* Character & Bow */
        .elf {
            position: absolute;
            width: 60px;
            height: 80px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            will-change: left;
        }

        .elf-emoji {
            font-size: 50px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
            user-select: none;
        }

        .bow-container {
            position: absolute;
            width: 60px;
            height: 100px;
            top: 35px;
            left: 25px; 
            pointer-events: none;
            transform-origin: 10px 50px; 
            transition: transform 0.1s ease-out;
        }

        .arrow {
            position: absolute;
            width: 40px;
            height: 3px;
            background: #8d6e63;
            border-radius: 2px;
            z-index: 15;
        }
        .arrow::before { 
            content: '';
            position: absolute;
            left: 0; top: -3px;
            width: 8px; height: 9px;
            background: #34d399;
            clip-path: polygon(0 0, 100% 30%, 100% 70%, 0 100%);
        }
        .arrow::after { 
            content: '';
            position: absolute;
            right: -2px; top: -2px;
            width: 6px; height: 6px;
            background: #94a3b8;
            transform: rotate(45deg);
        }

        .hud {
            padding: 1.5rem;
            background: var(--nav-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stat-box {
            background: rgba(212, 175, 55, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--gold);
            font-weight: bold;
            color: var(--gold);
            font-family: var(--font-heading);
            letter-spacing: 1px;
        }

        #start-btn {
            padding: 10px 30px;
            font-size: 1rem;
            background: linear-gradient(45deg, var(--wood-brown), var(--forest-light));
            color: var(--gold);
            border: 2px solid var(--gold);
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            font-family: var(--font-heading);
        }

        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--gold-glow);
            color: #fff;
        }
    </style>
</head>

<body class="page-transition">

    <div class="magical-bg-container"></div>
    <div class="overlay"></div>
    <div class="mist"></div>

    <nav>
        <a href="../index.html">← Return to Forest</a>
        <a href="index.html">Gallery</a>
        <a href="info.html">Lore</a>
        <a href="game.html" class="active">Mini-Game</a>
    </nav>

    <div class="game-canvas-wrapper">
        <div class="hud">
            <h2 class="cinzel" style="margin:0; font-size: 1.5rem;">Emerald Archer</h2>
            <div class="stat-box">HITS: <span id="hits">0</span></div>
            <button id="start-btn">Begin Hunt</button>
            <div style="font-size: 12px; color: var(--gold); opacity: 0.8; font-family: var(--font-body);">Use <b>A / D</b> or <b>Arrows</b> to move</div>
        </div>

        <div class="archery-canvas" id="canvas">
    <div class="elf" id="player-elf" style="left: 50%;">
        <div class="elf-emoji">🧝</div>
        <div class="bow-container" id="bow-ui">
            <svg width="60" height="100" viewBox="0 0 60 100">
                <path d="M 10 10 C 50 10, 50 90, 10 90" fill="none" stroke="#5d4037" stroke-width="6" stroke-linecap="round"/>
                <path id="bow-string" d="M 10 12 L 10 50 L 10 88" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
            </svg>
        </div>
    </div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const hitsEl = document.getElementById('hits');
const startBtn = document.getElementById('start-btn');
const bowString = document.getElementById('bow-string');
const bowContainer = document.getElementById('bow-ui');
const playerElf = document.getElementById('player-elf');

let hits = 0;
let arrows = [];
let targets = [];
let isPlaying = false;
const gravity = 0.25;

// --- MOVEMENT VARIABLES ---
let playerX = canvas.clientWidth / 2;
let moveDir = 0; // -1 for left, 1 for right, 0 for still
const moveSpeed = 7;

let mouseX = 0;
let mouseY = 0;
let isAiming = false;
let aimStartX = 0;
let aimStartY = 0;

// Input Listeners
window.addEventListener('keydown', (e) => {
    if (e.key === 'a' || e.key === 'ArrowLeft') moveDir = -1;
    if (e.key === 'd' || e.key === 'ArrowRight') moveDir = 1;
});

window.addEventListener('keyup', (e) => {
    if ((e.key === 'a' || e.key === 'ArrowLeft') && moveDir === -1) moveDir = 0;
    if ((e.key === 'd' || e.key === 'ArrowRight') && moveDir === 1) moveDir = 0;
});

window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    updateBowRotation();
});

function updateBowRotation() {
    const bowWorldX = playerX + 35;
    const bowWorldY = canvas.clientHeight - 45;

    if (!isAiming) {
        const angle = Math.atan2(mouseY - bowWorldY, mouseX - bowWorldX);
        bowContainer.style.transform = `rotate(${angle}rad)`;
    } else {
        const dx = aimStartX - mouseX;
        const dy = aimStartY - mouseY;
        const angle = Math.atan2(dy, dx);
        const dist = Math.sqrt(dx*dx + dy*dy);
        const drawAmount = Math.min(dist / 2, 40);
        
        bowContainer.style.transform = `rotate(${angle}rad)`;
        bowString.setAttribute('d', `M 10 12 L ${10 - drawAmount} 50 L 10 88`);
    }
}

canvas.addEventListener('mousedown', (e) => {
    if (!isPlaying) return;
    isAiming = true;
    const rect = canvas.getBoundingClientRect();
    aimStartX = e.clientX - rect.left;
    aimStartY = e.clientY - rect.top;
});

window.addEventListener('mouseup', (e) => {
    if (!isAiming) return;
    isAiming = false;

    const dx = aimStartX - mouseX;
    const dy = aimStartY - mouseY;
    const angle = Math.atan2(dy, dx);
    const dist = Math.sqrt(dx*dx + dy*dy);
    const power = Math.min(dist * 0.15, 20);
    
    bowString.setAttribute('d', `M 10 12 L 10 50 L 10 88`);
    if (power > 2) shootArrow(angle, power);
});

function shootArrow(angle, power) {
    const arrowEl = document.createElement('div');
    arrowEl.className = 'arrow';
    canvas.appendChild(arrowEl);

    arrows.push({
        el: arrowEl,
        x: playerX + 35,
        y: canvas.clientHeight - 45,
        vx: Math.cos(angle) * power,
        vy: Math.sin(angle) * power,
        rotation: angle
    });
}

function spawnTarget() {
    const targetEl = document.createElement('div');
    targetEl.className = 'target';
    const x = Math.random() * (canvas.clientWidth - 100) + 50;
    const y = Math.random() * (canvas.clientHeight - 250) + 50;
    targetEl.style.left = x + 'px';
    targetEl.style.top = y + 'px';
    canvas.appendChild(targetEl);
    targets.push({ el: targetEl, x, y, size: 40 });

    setTimeout(() => {
        if (targetEl.parentNode) {
            targetEl.remove();
            targets = targets.filter(t => t.el !== targetEl);
        }
    }, 4000);
}

function update() {
    // --- MOVE PLAYER ---
    if (moveDir !== 0) {
        playerX += moveDir * moveSpeed;
        // Boundary checks
        if (playerX < 0) playerX = 0;
        if (playerX > canvas.clientWidth - 60) playerX = canvas.clientWidth - 60;
        
        playerElf.style.left = playerX + 'px';
        updateBowRotation(); // Keep bow pointing at cursor while walking
    }

    // --- ARROW PHYSICS ---
    arrows.forEach((arrow, i) => {
        arrow.vy += gravity;
        arrow.x += arrow.vx;
        arrow.y += arrow.vy;
        arrow.rotation = Math.atan2(arrow.vy, arrow.vx);

        arrow.el.style.left = arrow.x + 'px';
        arrow.el.style.top = arrow.y + 'px';
        arrow.el.style.transform = `translate(-50%, -50%) rotate(${arrow.rotation}rad)`;

        targets.forEach((target, ti) => {
            const dx = arrow.x - (target.x + 20);
            const dy = arrow.y - (target.y + 20);
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < 25) {
                target.el.style.transform = 'scale(1.5)';
                target.el.style.opacity = '0';
                setTimeout(() => target.el.remove(), 100);
                arrow.el.remove();
                targets.splice(ti, 1);
                arrows.splice(i, 1);
                hits++;
                hitsEl.innerText = hits;
            }
        });

        if (arrow.y > canvas.clientHeight + 100 || arrow.x > canvas.clientWidth + 100 || arrow.x < -100) {
            if (arrow.el.parentNode) arrow.el.remove();
            arrows.splice(i, 1);
        }
    });

    requestAnimationFrame(update);
}

startBtn.addEventListener('click', () => {
    if (isPlaying) return;
    isPlaying = true;
    hits = 0;
    hitsEl.innerText = hits;
    startBtn.innerText = "HUNTING...";
    startBtn.style.opacity = "0.5";

    let count = 0;
    const interval = setInterval(() => {
        spawnTarget();
        count++;
        if (count >= 20) {
            clearInterval(interval);
            setTimeout(() => {
                isPlaying = false;
                startBtn.innerText = "Begin Hunt";
                startBtn.style.opacity = "1";
                alert("Hunt Concluded. Final Score: " + hits);
            }, 4000);
        }
    }, 1000);
});

update();
</script>
</body>
</html>
