<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Elf - Mini-Game</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .magical-bg-container {
            background-image: url('../images/elf.png');
            filter: brightness(0.3) contrast(1.1);
        }
        
        .archery-canvas {
            width: 100%;
            height: 400px;
            background: rgba(17, 42, 24, 0.7);
            border: 2px solid #a4d4b4;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
        }

        .target {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, red 20%, white 30%, red 50%, white 70%, red 90%);
            border-radius: 50%;
            cursor: crosshair;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .score-board {
            font-size: 2rem;
            color: #a4d4b4;
            font-family: var(--font-heading);
            margin-top: 1rem;
        }
    </style>
</head>
<body class="page-transition">

    <div class="magical-bg-container"></div>
    <div class="overlay"></div>

    <nav>
        <a href="../index.html">← Return to Forest</a>
        <a href="index.html">Gallery</a>
        <a href="info.html">Lore</a>
        <a href="game.html" class="active">Mini-Game</a>
    </nav>

    <main>
        <div class="content-box game-container">
            <h1 class="cinzel" style="font-size: 2.5rem; color: #a4d4b4;">Archery Practice</h1>
            <p style="color: #ccc; margin-top: 1rem;">Click the moving targets before they vanish. Test your reflexes.</p>
            
            <div class="score-board">Hits: <span id="hits">0</span></div>
            
            <button class="btn-magic" id="start-btn" style="margin-bottom: 2rem;">Start Practice</button>

            <div class="archery-canvas" id="canvas"></div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('start-btn');
        const hitsEl = document.getElementById('hits');
        
        let hits = 0;
        let gameInterval;
        let isPlaying = false;

        startBtn.addEventListener('click', () => {
            if(isPlaying) return;
            isPlaying = true;
            hits = 0;
            hitsEl.innerText = hits;
            startBtn.innerText = "Practicing...";
            canvas.innerHTML = '';
            
            // Spawn a target every 1.5 seconds, for 15 seconds
            let spawnCount = 0;
            gameInterval = setInterval(() => {
                spawnTarget();
                spawnCount++;
                if(spawnCount >= 10) {
                    clearInterval(gameInterval);
                    setTimeout(() => {
                        isPlaying = false;
                        startBtn.innerText = "Play Again";
                        alert("Practice over! Total Hits: " + hits);
                    }, 2000);
                }
            }, 1000);
        });

        function spawnTarget() {
            const target = document.createElement('div');
            target.classList.add('target');
            
            const maxX = canvas.clientWidth - 50;
            const maxY = canvas.clientHeight - 50;
            
            target.style.left = Math.random() * maxX + 'px';
            target.style.top = Math.random() * maxY + 'px';
            
            target.addEventListener('mousedown', () => {
                hits++;
                hitsEl.innerText = hits;
                target.remove();
            });

            canvas.appendChild(target);

            // Target disappears after a short time
            setTimeout(() => {
                if(target.parentNode) target.remove();
            }, 800);
        }
    </script>
</body>
</html>
