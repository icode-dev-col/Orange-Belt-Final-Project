<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Dragon's Maze - Hoard Edition</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            color: #e0e0e0;
            font-family: 'Palatino', serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* --- Background Elements --- */
        .magical-bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('../images/dragon.png');
            background-size: cover;
            background-position: center;
            filter: brightness(0.15);
            z-index: -2;
        }
        .mist {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 30%, black 100%);
            z-index: -1;
            opacity: 0.7;
        }

        /* --- Navigation --- */
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 30;
        }
        nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        nav a:hover, nav a.active {
            color: gold;
        }

        /* --- Top Bar --- */
        #topBar {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: linear-gradient(to bottom, rgba(34,34,34,0.8), rgba(0,0,0,0.9));
            border-bottom: 2px solid #444;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 20;
            flex-shrink: 0;
        }

        #level {
            color: gold;
            margin-left: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        #gameContainer {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        #maze {
            display: grid;
            gap: 2px; 
            border: 4px solid #333;
            background: rgba(17, 17, 17, 0.8);
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .path {
            background: rgba(28, 28, 28, 0.6);
            border: 1px solid rgba(40, 40, 40, 0.5);
        }

        /* --- Wall Styling --- */
        .wall {
            background-color: #222;
            background-image: 
                linear-gradient(335deg, #111 23%, transparent 23%),
                linear-gradient(155deg, #1a1a1a 23%, transparent 23%);
            box-shadow: inset 0 0 8px #000;
        }

        #player {
            filter: drop-shadow(0 0 15px rgba(255, 100, 0, 1));
            animation: breathe 2s infinite ease-in-out;
            z-index: 20;
            transform: scaleX(-1);
        }

        .goal {
            filter: drop-shadow(0 0 10px gold);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes breathe {
            0%, 100% { transform: scaleX(-1) scale(0.9); }
            50% { transform: scaleX(-1) scale(1.1); }
        }

        @keyframes pulse {
            from { transform: scale(0.8); }
            to { transform: scale(1.1); }
        }

        #winScreen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: gold;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="magical-bg-container"></div>
<div class="mist"></div>

<nav>
    <a href="../index.html">← Return to Forest</a>
    <a href="index.html">Gallery</a>
    <a href="info.html">Lore</a>
    <a href="game.html" class="active">Mini-Game</a>
</nav>

<header class="hero">
    <h1 class="cinzel">The Dragon's Maze <span id="level">1</span></h1>
</header>

<div id="gameContainer">
    <div id="maze"></div>
</div>

<div id="winScreen">
    <h1>👑 HOARD SECURED</h1>
    <p>You have conquered all chambers.</p>
    <button onclick="location.reload()" style="padding: 12px 24px; cursor: pointer; background: gold; border: none; font-weight: bold; border-radius: 5px; margin-top: 20px;">Replay Quest</button>
</div>

<script>
const mazeEl = document.getElementById("maze");
const levelEl = document.getElementById("level");
const winScreen = document.getElementById("winScreen");

let currentLevelIdx = 0;
let playerPos = {x:0, y:0};

const levels = [
    ["########","#S....G#","########"],
    ["##########","#S..#....#","#.#.#.##.#","#.#...#..#","#.#####..#","#......G.#","##########"],
    ["############","#S..#......#","#.#.#.####.#","#.#.#....#.#","#...####.#.#","###......#.#","#.########.#","#........G.#","############"],
    ["##############","#S#..........#","#.#.########.#","#.#.#......#.#","#...#.####.#.#","###.#.#....#.#","#...#.#.####.#","#.###.#......#","#.....######.#","#.##########G#","##############"],
    ["################","#S#............#","#.#.##########.#","#.#.#........#.#","#.#.#.######.#.#","#...#.#....#.#.#","#####.#.##.#.#.#","#.....#.#..#.#.#","#.#####.#.##.#.#","#.#.....#....#.#","#.#.##########.#","#.#............#","#.############.#","#............#G#","################"]
];

function loadLevel() {
    mazeEl.innerHTML = "";
    levelEl.innerText = currentLevelIdx + 1;
    
    const map = levels[currentLevelIdx];
    const rows = map.length;
    const cols = map[0].length;

    const availableWidth = window.innerWidth * 0.85;
    const availableHeight = (window.innerHeight - 150) * 0.85;
    const cellSize = Math.floor(Math.min(availableWidth / cols, availableHeight / rows));

    mazeEl.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
    mazeEl.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;

    map.forEach((row, y) => {
        [...row].forEach((cell, x) => {
            const div = document.createElement("div");
            div.classList.add("cell");
            div.style.width = `${cellSize}px`;
            div.style.height = `${cellSize}px`;

            if (cell === "#") {
                div.classList.add("wall");
            } else {
                div.classList.add("path");
            }

            if (cell === "S") {
                playerPos = {x, y};
                div.id = "player";
                div.innerHTML = "🐉";
                div.style.fontSize = `${cellSize * 0.7}px`;
            }

            if (cell === "G") {
                div.classList.add("goal");
                div.innerHTML = "🪙";
                div.style.fontSize = `${cellSize * 0.6}px`;
            }

            mazeEl.appendChild(div);
        });
    });
}

function move(dx, dy) {
    const map = levels[currentLevelIdx];
    const newX = playerPos.x + dx;
    const newY = playerPos.y + dy;

    if (newY < 0 || newY >= map.length || newX < 0 || newX >= map[0].length) return;
    if (map[newY][newX] === "#") return;

    const cells = document.querySelectorAll(".cell");
    const cols = map[0].length;
    const oldIndex = playerPos.y * cols + playerPos.x;
    const newIndex = newY * cols + newX;

    const playerEmoji = cells[oldIndex].innerHTML;
    const playerSize = cells[oldIndex].style.fontSize;

    cells[oldIndex].innerHTML = "";
    cells[oldIndex].id = "";

    playerPos = {x:newX, y:newY};
    
    if (map[newY][newX] === "G") {
        currentLevelIdx++;
        if (currentLevelIdx >= levels.length) {
            winScreen.style.display = "flex";
        } else {
            setTimeout(loadLevel, 100);
        }
    } else {
        cells[newIndex].id = "player";
        cells[newIndex].innerHTML = playerEmoji;
        cells[newIndex].style.fontSize = playerSize;
    }
}

window.addEventListener("resize", loadLevel);

document.addEventListener("keydown", e => {
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
        e.preventDefault();
    }
    if (e.key === "ArrowUp") move(0,-1);
    if (e.key === "ArrowDown") move(0,1);
    if (e.key === "ArrowLeft") move(-1,0);
    if (e.key === "ArrowRight") move(1,0);
});

loadLevel();
</script>

</body>
</html>
