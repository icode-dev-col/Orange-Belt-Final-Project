<body>

<div id="game">
    <div id="topBar">
        🐉 Level: <span id="level">1</span>
    </div>

    <div id="maze"></div>

    <div id="winScreen">
        <h1>🎉 Game Complete!</h1>
    </div>
</div>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: sans-serif;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

#topBar {
    padding: 10px;
    font-size: 20px;
    text-align: center;
    background: #111;
}

#maze {
    flex: 1;
    display: grid;
    justify-content: center;
    align-content: center;
}

.cell {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: calc(2vmin);
}

.wall {
    background: #222;
}

.path {
    background: #000;
}

.goal {
    background: gold;
}

#player {
    font-size: calc(3vmin);
}

#winScreen {
    position: absolute;
    width: 100%;
    height: 100%;
    background: black;
    display: none;
    justify-content: center;
    align-items: center;
    font-size: 40px;
}
</style>

<script>
const mazeEl = document.getElementById("maze");
const levelEl = document.getElementById("level");
const winScreen = document.getElementById("winScreen");

let level = 0;
let playerPos = {x:0,y:0};

const levels = [

/* LEVEL 1 (tutorial) */
[
"########",
"#S....G#",
"########"
],

/* LEVEL 2 (fake paths start) */
[
"##########",
"#S..#....#",
"#.#.#.##.#",
"#.#...#..#",
"#.#####..#",
"#......G.#",
"##########"
],

/* LEVEL 3 (multiple wrong decisions) */
[
"############",
"#S..#......#",
"#.#.#.####.#",
"#.#.#....#.#",
"#...####.#.#",
"###......#.#",
"#.########.#",
"#........G.#",
"############"
],

/* LEVEL 4 (long path + traps) */
[
"##############",
"#S#..........#",
"#.#.########.#",
"#.#.#......#.#",
"#...#.####.#.#",
"###.#.#....#.#",
"#...#.#.####.#",
"#.###.#......#",
"#.....######.#",
"#.##########G#",
"##############"
],

/* LEVEL 5 (INSANE – like Poki style) */
[
"################",
"#S#............#",
"#.#.##########.#",
"#.#.#........#.#",
"#.#.#.######.#.#",
"#...#.#....#.#.#",
"#####.#.##.#.#.#",
"#.....#.#..#.#.#",
"#.#####.#.##.#.#",
"#.#.....#....#.#",
"#.#.##########.#",
"#.#............#",
"#.############.#",
"#............#G#",
"################"
]




];

function loadLevel() {
    mazeEl.innerHTML = "";
    const map = levels[level];

    const rows = map.length;
    const cols = map[0].length;

    mazeEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    mazeEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

    map.forEach((row, y) => {
        [...row].forEach((cell, x) => {
            const div = document.createElement("div");
            div.classList.add("cell");

            if (cell === "#") div.classList.add("wall");
            else div.classList.add("path");

            if (cell === "S") {
                playerPos = {x, y};
                div.id = "player";
                div.innerHTML = "🐉";
            }

            if (cell === "G") div.classList.add("goal");

            mazeEl.appendChild(div);
        });
    });

    levelEl.innerText = level + 1;
}

function move(dx, dy) {
    const map = levels[level];
    const newX = playerPos.x + dx;
    const newY = playerPos.y + dy;

    if (map[newY][newX] === "#") return;

    const cells = document.querySelectorAll(".cell");
    const cols = map[0].length;

    const oldIndex = playerPos.y * cols + playerPos.x;
    const newIndex = newY * cols + newX;

    cells[oldIndex].innerHTML = "";
    cells[oldIndex].removeAttribute("id");

    playerPos = {x:newX,y:newY};

    cells[newIndex].id = "player";
    cells[newIndex].innerHTML = "🐉";

    if (map[newY][newX] === "G") {
        level++;
        if (level >= levels.length) {
            winScreen.style.display = "flex";
            return;
        }
        loadLevel();
    }
}

document.addEventListener("keydown", e => {
    if (e.key === "ArrowUp") move(0,-1);
    if (e.key === "ArrowDown") move(0,1);
    if (e.key === "ArrowLeft") move(-1,0);
    if (e.key === "ArrowRight") move(1,0);
});

loadLevel();
</script>

</body>
