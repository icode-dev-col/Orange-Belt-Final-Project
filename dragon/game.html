<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dragon's Maze</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="page-transition">

    <div class="magical-bg-container" style="background-image: url('../images/dragon.png'); filter: brightness(0.2);"></div>
    <div class="overlay"></div>
    <div class="mist"></div>

    <nav>
        <a href="../index.html">← Return to Forest</a>
        <a href="index.html">Gallery</a>
        <a href="info.html">Lore</a>
        <a href="game.html" class="active">Mini-Game</a>
    </nav>

<div id="game">
    <div id="topBar">
        🐉 Level: <span id="level">1</span>
    </div>

    <div id="maze"></div>

    <div id="winScreen">
        <h1>🎉 Game Complete!</h1>
    </div>
</div>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: sans-serif;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 10;
}

#topBar {
    padding: 10px;
    font-size: 20px;
    text-align: center;
    background: rgba(17, 17, 17, 0.8);
    backdrop-filter: blur(5px);
}

#maze {
    flex: 1;
    display: grid;
    justify-content: center;
    align-content: center;
}

.cell {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: calc(2vmin);
}

.wall {
    background: #1a1a1a;
    border: 1px solid #333;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
}

.fire-wall {
    background: #1a0500;
    position: relative;
    z-index: 5;
    /* No overflow hidden here to let flames rise */
}

/* The rising flames */
.fire-wall::before {
    content: '';
    position: absolute;
    bottom: 20%;
    left: 50%;
    width: 140%;
    height: 250%;
    background: radial-gradient(ellipse at bottom, 
        rgba(255, 255, 255, 1) 0%, 
        rgba(255, 255, 0, 0.9) 20%, 
        rgba(255, 100, 0, 0.8) 40%, 
        rgba(255, 50, 0, 0.6) 60%, 
        transparent 80%);
    transform: translateX(-50%);
    filter: blur(4px);
    border-radius: 50% 50% 20% 20%;
    animation: flame-rise 0.8s infinite ease-in;
    mix-blend-mode: screen;
    pointer-events: none;
    opacity: 0;
}

/* Second layer of flames for depth */
.fire-wall::after {
    content: '';
    position: absolute;
    bottom: 10%;
    left: 50%;
    width: 100%;
    height: 180%;
    background: radial-gradient(ellipse at bottom, 
        rgba(255, 200, 0, 0.9) 0%, 
        rgba(255, 50, 0, 0.7) 50%, 
        transparent 80%);
    transform: translateX(-50%);
    filter: blur(6px);
    border-radius: 50% 50% 20% 20%;
    animation: flame-rise 1.2s infinite ease-in;
    animation-delay: 0.2s;
    mix-blend-mode: screen;
    pointer-events: none;
    opacity: 0;
}

@keyframes flame-rise {
    0% { 
        transform: translateX(-50%) translateY(0) scale(0.8, 0.5);
        opacity: 0;
    }
    10% {
        opacity: 1;
    }
    50% { 
        transform: translateX(-45%) translateY(-15px) scale(1.1, 1.2);
        opacity: 0.8;
    }
    100% { 
        transform: translateX(-55%) translateY(-40px) scale(0.5, 1.5);
        opacity: 0;
    }
}

/* The block itself glowing */
.wall.fire-wall {
    box-shadow: 0 0 15px #ff4500, inset 0 0 10px #ff8c00;
    border-color: #ff4500;
}

.path {
    background: rgba(0, 0, 0, 0.4);
}

.goal {
    background: gold;
}

#player {
    font-size: calc(3vmin);
    z-index: 10;
    position: relative;
}

#winScreen {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: none;
    justify-content: center;
    align-items: center;
    font-size: 40px;
}
</style>

<script>
const mazeEl = document.getElementById("maze");
const levelEl = document.getElementById("level");
const winScreen = document.getElementById("winScreen");

let level = 0;
let playerPos = {x:0,y:0};

const levels = [

/* LEVEL 1 (tutorial) */
[
"########",
"#S....G#",
"########"
],

/* LEVEL 2 (fake paths start) */
[
"##########",
"#S..#....#",
"#.#.#.##.#",
"#.#...#..#",
"#.#####..#",
"#......G.#",
"##########"
],

/* LEVEL 3 (multiple wrong decisions) */
[
"############",
"#S..#......#",
"#.#.#.####.#",
"#.#.#....#.#",
"#...####.#.#",
"###......#.#",
"#.########.#",
"#........G.#",
"############"
],

/* LEVEL 4 (long path + traps) */
[
"##############",
"#S#..........#",
"#.#.########.#",
"#.#.#......#.#",
"#...#.####.#.#",
"###.#.#....#.#",
"#...#.#.####.#",
"#.###.#......#",
"#.....######.#",
"#.##########G#",
"##############"
],

/* LEVEL 5 (INSANE – like Poki style) */
[
"################",
"#S#............#",
"#.#.##########.#",
"#.#.#........#.#",
"#.#.#.######.#.#",
"#...#.#....#.#.#",
"#####.#.##.#.#.#",
"#.....#.#..#.#.#",
"#.#####.#.##.#.#",
"#.#.....#....#.#",
"#.#.##########.#",
"#.#............#",
"#.############.#",
"#............#G#",
"################"
]




];

function loadLevel() {
    mazeEl.innerHTML = "";
    const map = levels[level];

    const rows = map.length;
    const cols = map[0].length;

    mazeEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    mazeEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

    map.forEach((row, y) => {
        [...row].forEach((cell, x) => {
            const div = document.createElement("div");
            div.classList.add("cell");

            if (cell === "#") {
                div.classList.add("wall");
                // Add fire to the border walls
                if (x === 0 || y === 0 || x === cols - 1 || y === rows - 1) {
                    div.classList.add("fire-wall");
                    div.style.animationDelay = `${Math.random() * 2}s`;
                }
            }
            else div.classList.add("path");

            if (cell === "S") {
                playerPos = {x, y};
                div.id = "player";
                div.innerHTML = "🐉";
            }

            if (cell === "G") div.classList.add("goal");

            mazeEl.appendChild(div);
        });
    });

    levelEl.innerText = level + 1;
}

function move(dx, dy) {
    const map = levels[level];
    const newX = playerPos.x + dx;
    const newY = playerPos.y + dy;

    if (newY < 0 || newY >= map.length || newX < 0 || newX >= map[0].length) return;
    if (map[newY][newX] === "#") return;

    const cells = document.querySelectorAll(".cell");
    const cols = map[0].length;

    const oldIndex = playerPos.y * cols + playerPos.x;
    const newIndex = newY * cols + newX;

    cells[oldIndex].innerHTML = "";
    cells[oldIndex].removeAttribute("id");

    playerPos = {x:newX,y:newY};

    cells[newIndex].id = "player";
    cells[newIndex].innerHTML = "🐉";

    if (map[newY][newX] === "G") {
        level++;
        if (level >= levels.length) {
            winScreen.style.display = "flex";
            return;
        }
        loadLevel();
    }
}

document.addEventListener("keydown", e => {
    if (e.key === "ArrowUp") move(0,-1);
    if (e.key === "ArrowDown") move(0,1);
    if (e.key === "ArrowLeft") move(-1,0);
    if (e.key === "ArrowRight") move(1,0);
});

loadLevel();
</script>

</body>
</html>
