<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Unicorn - Mini-Game</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .magical-bg-container {
            background-image: url('../images/unicorn.png');
            filter: brightness(0.3) contrast(1.1);
        }
        
        .magic-canvas {
            width: 100%;
            height: 300px;
            background: rgba(0,0,0,0.6);
            border: 2px dashed #fff;
            border-radius: 12px;
            position: relative;
            cursor: crosshair;
            overflow: hidden;
            margin-top: 2rem;
        }

        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 5px rgba(255, 255, 255, 0.8);
            animation: twinkle 1.5s infinite alternate;
        }

        @keyframes twinkle {
            0% { transform: scale(0.5); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 1; }
        }
    </style>
</head>
<body class="page-transition">

    <div class="magical-bg-container"></div>
    <div class="overlay"></div>

    <nav>
        <a href="../index.html">← Return to Forest</a>
        <a href="index.html">Gallery</a>
        <a href="info.html">Lore</a>
        <a href="game.html" class="active">Mini-Game</a>
    </nav>

    <main>
        <div class="content-box game-container">
            <h1 class="cinzel" style="font-size: 2.5rem; color: #fff;">Reveal the Magic</h1>
            <p style="color: #ccc; margin-top: 1rem;">Click inside the dark enchanted area to summon stardust sparkles.</p>
            
            <div class="magic-canvas" id="canvas"></div>
            
            <button class="btn-magic feed" id="clear-btn" style="margin-top: 2rem;">Clear Magic</button>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('canvas');
        const clearBtn = document.getElementById('clear-btn');

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            
            // Randomize size
            const size = Math.random() * 5 + 3;
            sparkle.style.width = size + 'px';
            sparkle.style.height = size + 'px';
            
            // Position
            sparkle.style.left = (x - size/2) + 'px';
            sparkle.style.top = (y - size/2) + 'px';

            canvas.appendChild(sparkle);
            
            // Audio effect simulation (just visuals for now)
        });

        clearBtn.addEventListener('click', () => {
            canvas.innerHTML = '';
        });
    </script>
</body>
</html>
