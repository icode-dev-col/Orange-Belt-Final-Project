<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixie Magic Jump </title>
<style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a0033; }
    .overlay { position: fixed; width: 100%; height: 100%; background: linear-gradient(to bottom, #1a0033, #4a0080); z-index: -1; }
    #game { position: absolute; width: 100%; height: 100%; }
    
    /* Player Pixie */
    #player { 
        width: 40px; height: 40px; 
        position: absolute; 
        display: flex; justify-content: center; align-items: center;
        font-size: 35px; 
        z-index: 10;
        transition: transform 0.1s;
    }

    /* Platforms */
    /* Platforms -> CLOUD STYLE */
.platform {
    height: 20px;
    position: absolute;
    border-radius: 50px;
    background: white;
    box-shadow: 
        20px 0 0 0 white,
        40px 5px 0 0 white,
        10px -5px 0 0 white,
        30px -8px 0 0 white,
        50px 0 0 0 white,
        0 4px 8px rgba(0,0,0,0.2);
}

/* Normal cloud */
.normal {
    background: #ffffff;
}

/* Moving cloud (slightly glowing so player notices movement) */
.moving {
    background: #e0f7ff;
    box-shadow: 
        20px 0 0 0 #e0f7ff,
        40px 5px 0 0 #e0f7ff,
        10px -5px 0 0 #e0f7ff,
        30px -8px 0 0 #e0f7ff,
        50px 0 0 0 #e0f7ff,
        0 0 10px rgba(0,255,255,0.6);
}

/* Breaking cloud (faded / unstable look) */
.breaking {
    background: #f8f8f8;
    opacity: 0.7;
    box-shadow: 
        20px 0 0 0 #f8f8f8,
        40px 5px 0 0 #f8f8f8,
        10px -5px 0 0 #f8f8f8,
        30px -8px 0 0 #f8f8f8,
        50px 0 0 0 #f8f8f8,
        0 0 8px rgba(255,255,255,0.5);
    border: 1px dashed rgba(200,200,200,0.6);
}

    /* Powerups */
    .powerup { 
        width: 25px; height: 25px; position: absolute; 
        border-radius: 50%; display: flex; justify-content: center; 
        align-items: center; font-size: 15px; animation: twinkle 0.5s infinite alternate; 
    }
    .wing { background: cyan; box-shadow: 0 0 15px cyan; } 
    .shield { background: magenta; box-shadow: 0 0 15px magenta; } 
    .mini { background: lime; box-shadow: 0 0 15px lime; } 

    #score { position: absolute; top: 20px; left: 20px; color: white; font-size: 28px; font-weight: bold; z-index: 20; text-shadow: 2px 2px 4px #000; }
    
    @keyframes twinkle { from { transform: scale(0.8); } to { transform: scale(1.2); } }

    .screen { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 100; text-align: center; }
    button { padding: 15px 40px; font-size: 20px; background: gold; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { transform: scale(1.1); background: #fff; }
</style>
</head>
<body>

<div class="overlay"></div>
<div id="game">
    <div id="score">Score: 0</div>
    <div id="player">🧚</div>
    
    <div id="startScreen" class="screen">
        <h1>🧚 Pixie Magic Jump</h1>
        <p>Use ← → to fly!</p>
        <button onclick="startGame()">Fly Now!</button>
    </div>

    <div id="gameOver" class="screen" style="display:none;">
        <h1>Poof! Magic Ran Out</h1>
        <p>Your Score: <span id="finalScore"></span></p>
        <button onclick="restart()">Try Again</button>
    </div>
</div>

<script>
const playerEl = document.getElementById("player");
const scoreText = document.getElementById("score");
const gameContainer = document.getElementById("game");

let x, y, vy, vx, score, gameRunning;
let gravity = 0.4;
let platforms = [];
let powerups = [];
const PLATFORM_COUNT = 300; // Updated to 300 platforms

function init() {
    x = window.innerWidth / 2 - 20;
    y = window.innerHeight - 150;
    vy = 0; vx = 0; score = 0;
    gameRunning = false;
    
    platforms.forEach(p => p.el.remove());
    powerups.forEach(p => p.el.remove());
    platforms = [];
    powerups = [];
    scoreText.innerText = "Score: 0";
    playerEl.style.transform = "scale(1)";
}

function addPlatform(px, py, width, type = 'normal') {
    let el = document.createElement("div");
    el.className = `platform ${type}`;
    el.style.width = width + "px";
    el.style.left = px + "px";
    el.style.top = py + "px";
    gameContainer.appendChild(el);
    
    platforms.push({
        el, x: px, y: py, w: width, 
        type: type, 
        dir: Math.random() > 0.5 ? 1 : -1
    });

    // Spawn powerups on about 5% of platforms
    if (Math.random() > 0.95) { 
        const types = ['wing', 'shield', 'mini'];
        const randType = types[Math.floor(Math.random() * types.length)];
        addPowerup(px + (width/2) - 12, py - 35, randType);
    }
}

function addPowerup(px, py, type) {
    let el = document.createElement("div");
    el.className = `powerup ${type}`;
    let icon = type === 'wing' ? '🪽' : (type === 'shield' ? '⭐' : '✨');
    el.innerText = icon;
    el.style.left = px + "px";
    el.style.top = py + "px";
    gameContainer.appendChild(el);
    powerups.push({el, x: px, y: py, type: type});
}

function createInitialPlatforms() {
    // Starting platform
    addPlatform(x - 30, y + 50, 100, 'normal');

    // Scatter 300 platforms throughout the starting vertical space
    for (let i = 1; i < PLATFORM_COUNT; i++) {
        spawnPlatformAtY(window.innerHeight - (i * 40)); // Closer vertical spacing for high density
    }
}

function spawnPlatformAtY(atY) {
    let type = 'normal';
    let rand = Math.random();
    if (rand > 0.9) type = 'moving';
    else if (rand > 0.8) type = 'breaking';
    
    addPlatform(
        Math.random() * (window.innerWidth - 80),
        atY,
        60 + Math.random() * 40,
        type
    );
}

function update() {
    if (!gameRunning) return;

    vy += gravity;
    y += vy;
    x += vx;

    if (x < -40) x = window.innerWidth;
    if (x > window.innerWidth) x = -40;

    platforms.forEach((p) => {
        if (p.type === 'moving') {
            p.x += p.dir * 1.5;
            if (p.x < 0 || p.x > window.innerWidth - p.w) p.dir *= -1;
            p.el.style.left = p.x + "px";
        }

        // Collision logic
        if (vy > 0 && x + 30 > p.x && x < p.x + p.w && y + 35 > p.y && y + 35 < p.y + 15) {
            if (p.type === 'breaking') {
                p.el.style.opacity = "0";
                setTimeout(() => { p.y = 10000; }, 100); 
            }
            vy = -12; 
            y = p.y - 35;
        }
    });

    powerups.forEach((p, index) => {
        if (x + 35 > p.x && x < p.x + 25 && y + 35 > p.y && y < p.y + 25) {
            applyPowerEffect(p.type);
            p.el.remove();
            powerups.splice(index, 1);
        }
    });

    // Vertical Camera Scroll
    if (y < window.innerHeight / 2) {
        let diff = window.innerHeight / 2 - y;
        y = window.innerHeight / 2;
        score += Math.floor(diff / 2);

        platforms.forEach(p => {
            p.y += diff;
            p.el.style.top = p.y + "px";
            
            // Loop platforms back to top when they fall off screen
            if (p.y > window.innerHeight) {
                p.y -= (PLATFORM_COUNT * 40); // Move to the very top of the stack
                p.x = Math.random() * (window.innerWidth - 80);
                p.el.style.left = p.x + "px";
                p.el.style.opacity = "1"; 
            }
        });

        powerups.forEach(p => {
            p.y += diff;
            p.el.style.top = p.y + "px";
        });
    }

    if (y > window.innerHeight) endGame();

    playerEl.style.left = x + "px";
    playerEl.style.top = y + "px";
    playerEl.style.transform = vx > 0 ? "scaleX(1)" : (vx < 0 ? "scaleX(-1)" : playerEl.style.transform);
    scoreText.innerText = "Score: " + score;

    requestAnimationFrame(update);
}

function applyPowerEffect(type) {
    if (type === 'wing') vy = -28;
    else if (type === 'shield') score += 1000;
    else if (type === 'mini') {
        playerEl.style.filter = "hue-rotate(150deg) brightness(1.5)";
        setTimeout(() => playerEl.style.filter = "none", 3000);
        vy = -20;
    }
}

window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") vx = -8;
    if (e.key === "ArrowRight") vx = 8;
});
window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") vx = 0;
});

function startGame() {
    init();
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameOver").style.display = "none";
    gameRunning = true;
    createInitialPlatforms();
    update();
}

function endGame() {
    gameRunning = false;
    document.getElementById("gameOver").style.display = "flex";
    document.getElementById("finalScore").innerText = score;
}

function restart() {
    startGame();
}
</script>
</body>
</html>
